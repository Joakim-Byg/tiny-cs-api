name: Build, Test, and Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tools (mise)
        uses: jdx/mise-action@v5

      # 1. Quality & Linting Gate
      - name: Code quality & static analysis
        run: just quality

      # 2. Automated Tests
      - name: Unit and integration tests
        run: just test

      # 3. Packaging (Native local build for tests)
      - name: Build candidate container image
        run: just build

      # 4. Runtime Isolation Check (Local PSS Simulation)
      - name: Exercise under Restricted PSS
        run: just exercise

      # 5. Vulnerability Scan
      - name: Scan dependencies and container image
        run: just scan

      # 6. Buildx & QEMU for Multi-Arch
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      # 7. Extract Metadata & Tags
      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      # 8. Publish Multi-Arch Image to GHCR
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch container image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ${{ github.repository }}
        run: |
          echo "### Multi-Arch Container Image Published :package:" >> $GITHUB_STEP_SUMMARY
          echo "Architectures: \`linux/amd64\`, \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Available tags:" >> $GITHUB_STEP_SUMMARY
          for tag in $TAGS; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull command:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${IMAGE_NAME,,}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
